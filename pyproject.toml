[project]
name = "ros2-docs-copilot"
version = "0.1.0"
description = "RAG agent + MCP server over the ROS 2 Jazzy documentation, with evals"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5",
  "fastembed>=0.4",
  "openai>=1.40",
  "mcp>=2.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-dotenv>=1.0",
  "rank-bm25>=0.2.2",
]

[project.scripts]
copilot-ingest = "copilot.ingest:main"
copilot-mcp = "copilot.mcp_server:main"
copilot-web = "copilot.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]
